# Mathematical letters and digits in other styles (bold, italic, script, fraktur, double-struck, sans-serif,
#   monospace), as MathCAT makes them from mathvariant: written as the plain letter or digit, because Dedicon has
#   no notation for font styles (as for "ℕ" -> "N" in unicode.yaml). Greek letters get "~" as in unicode.yaml.
# NOTE: whether Dedicon marks bold (e.g. for vectors) or other styles still needs to be investigated.
