---
# Dedicon: Dutch math notation in ASCII
# Rules are based on ../ASCIIMath/ASCIIMath_Rules.yaml
# Spaces: "𝐖" is a space that cleanup may remove, "𝐰" is a space that is always kept
# Rule order roughly follows ../ASCIIMath/ASCIIMath_Rules.yaml

# Dedicon rule for white space (mspace): MathCAT removes an mspace between other elements and puts its width (in em)
#   on a neighbour as data-previous-space-width/data-following-space-width.
#   A width of at least 0.7em becomes one space, also for a wider mspace: "x = 1 <mspace width='2em'/> y = 2" -> "x = 1 y = 2";
#   a narrower mspace is ignored ("a<mspace width='0.3em'/>b" -> "ab"). A space that another rule also writes
#   (mtext, "=", fraction) is not doubled: cleanup collapses spaces.
# Based on the whitespace rule in ../ASCIIMath/ASCIIMath_Rules.yaml (same threshold), which writes "\ " instead of a space
-
  name: whitespace
  tag: "!*"
  match: "not(self::m:math) and not($MatchingWhitespace) and (@data-previous-space-width >= 0.7 or @data-following-space-width >= 0.7)"
  replace:
  - with:
      variables: [MatchingWhitespace: "true()"]
      replace:
      - test:
          if: "@data-previous-space-width >= 0.7"
          then: [t: "𝐰"]
      - x: "."
      - test:
          if: "@data-following-space-width >= 0.7"
          then: [t: "𝐰"]

# Dedicon rule for square roots: "sqrt(" root ")", always with parentheses (since 2016): "sqrt(25)", "2sqrt(25)"
# Same as the msqrt rule in ../ASCIIMath/ASCIIMath_Rules.yaml
-
  name: default
  tag: msqrt
  match: "."
  replace:
  - t: "sqrt("
  - x: "*[1]"
  - t: ")"

# Dedicon rule for other roots: "root_" index "(" root ")": "root_3(8)", "root_q(a^p)"
# A compound index gets parentheses, like a compound subscript: "root_(1 + 2)(27)"
#   (same simple/bracketed tests as the script rule below)
# Based on the mroot rule in ../ASCIIMath/ASCIIMath_Rules.yaml, which writes "root(" index ")(" root ")"
-
  name: default
  tag: mroot
  match: "."
  replace:
  - t: "root_"
  - test:
    - if: "*[2][IsNode(., 'leaf') or (self::m:mrow and count(*)=2 and *[1][self::m:mo and (.='-' or .='\u2212' or .='\u2013')] and *[2][IsNode(., 'leaf')]) or (self::m:mrow and not(*[not(IsNode(., 'leaf'))]) and not(m:mo[not(.='\u2062' or .='\u2063')]))]"
      then: [x: "*[2]"]
    - else_if: "*[2][IsBracketed(., '', '')]"
      then: [x: "*[2]"]    # already bracketed
      else: [t: "(", x: "*[2]", t: ")"]
  - t: "("
  - x: "*[1]"
  - t: ")"

# Dedicon rule for fractions: numerator "/" denominator, in principle without spaces ("3/4")
# - There is a space before and after a fraction: "2 1/2", "1/3 x^3", "- 1/2"
#   These are removable spaces (𝐖): Dedicon_cleanup in src/braille.rs removes them next to brackets and punctuation,
#   "(dK/dq)", "sqrt(1/9)", "C(1 1/2, 3)", "lim{x --> 0}1/x", and at the start and end of the expression
#   Before an opening bracket the space is kept, so the bracket does not seem to belong to the denominator:
#   "d/dq (dK/dq)", "1/2 (x - 6)^2", "1 1/5 (x - 1)" (with the mixed number in a row of its own).
#   The bracket may be in a row around the fraction, if the fraction is the last part of those rows;
#   inside a script, root, etc. the other children are not neighbours ("sqrt(1/2)(x)")
# - Only the part that needs parentheses gets them: "(-5 + 3)/11", "21/(3sqrt(2))", "(4 + 2)/(4 - 2)"
# - Simple parts need no parentheses: a variable, a number, a negative number or variable ("-5/11"),
#   a root (it has its own parentheses: "7/sqrt(6)", "7/root_3(6)"), a sub- or superscript,
#   or a derivative part like "dx" ("dy/dx")
# - If both parts are simple and one is a sub- or superscript, there are spaces around "/" to end it:
#   "u_n / v_n", "a^p / q"; next to a part in parentheses no space is needed: "(3a^2)/b^3"
# Based on the mfrac rule in ../ASCIIMath/ASCIIMath_Rules.yaml
-
  name: default
  tag: mfrac
  match: "."
  variables:
  - SimpleNumerator: "*[1][self::m:mi or self::m:mn or self::m:msub or self::m:msup or self::m:msubsup or self::m:msqrt or self::m:mroot or
                           (self::m:mrow and count(*)=2 and *[1][self::m:mo and (.='-' or .='\u2212')] and *[2][self::m:mn or self::m:mi]) or
                           (self::m:mrow and count(*)=3 and *[1]='d' and *[2]='\u2062' and *[3][self::m:mi])]"
  - SimpleDenominator: "*[2][self::m:mi or self::m:mn or self::m:msub or self::m:msup or self::m:msubsup or self::m:msqrt or self::m:mroot or
                             (self::m:mrow and count(*)=2 and *[1][self::m:mo and (.='-' or .='\u2212')] and *[2][self::m:mn or self::m:mi]) or
                             (self::m:mrow and count(*)=3 and *[1]='d' and *[2]='\u2062' and *[3][self::m:mi])]"
  - After: "ancestor-or-self::*[following-sibling::*][1]"    # nearest element (this one or a row around it) with something after it
  replace:
  - t: "𝐖"
  - test:
    - if: "not($SimpleNumerator) or not($SimpleDenominator)"
      then:
      - test:
          if: "$SimpleNumerator"
          then: [x: "*[1]"]
          else: [t: "(", x: "*[1]", t: ")"]
      - t: "/"
      - test:
          if: "$SimpleDenominator"
          then: [x: "*[2]"]
          else: [t: "(", x: "*[2]", t: ")"]
    - else_if: "*[self::m:msub or self::m:msup or self::m:msubsup]"
      then: [x: "*[1]", t: "𝐰/𝐰", x: "*[2]"]
      else: [x: "*[1]", t: "/", x: "*[2]"]
  - test:
      if: "(count($After | .) = 1 or $After[self::m:mrow]) and $After[parent::m:mrow or parent::m:math] and
           not(ancestor::*[not(self::m:mrow)][count(. | $After/descendant::*) = count($After/descendant::*)]) and
           ($After/following-sibling::*[not(self::m:mo and .='\u2062')][1]/descendant-or-self::*[not(*)])[1]
             [self::m:mo and IsInDefinition(., 'Braille', 'OpeningBrackets')]"
      then: [t: "𝐰"]
      else: [t: "𝐖"]

# Dedicon rules for matrices: cells separated by ":" without spaces, rows separated by ";" and a space
#   "[a:b:c; d:e:f; g:h:i]", "det(A) = |a:b:c; d:e:f; g:h:i|", "[1 1/2:1; 2 1/4:2]"
# The brackets around the matrix are taken over from the formula; MathCAT already turns them into
#   mo elements next to the mtable, so these rules only write the rows and cells.
# A table without brackets (e.g. a system of equations) gets no brackets: Dedicon has no rule for it.
# Same structure as the mtable, mtr and mtd rules in ../ASCIIMath/ASCIIMath_Rules.yaml, which put each
#   row in "[...]" and separate rows and cells with ","
-
  name: default
  tag: mtable
  match: "."
  replace: [x: "*"]

-
  name: default
  tag: [mtr, mlabeledtr]
  match: "."
  replace:
  - x: "*"
  - test:
      if: "following-sibling::*"
      then: [t: ";𝐰"]

# Dedicon rule: an empty cell is written as "gg": "[a:gg; c:d]"
# MathCAT fills an empty cell (or a cell with only white space) with an mtext marked data-empty-in-2D
-
  name: default
  tag: mtd
  match: "."
  replace:
  - test:
      if: "count(*)=1 and *[1][@data-empty-in-2D='true']"
      then: [t: "gg"]
      else: [x: "*"]
  - test:
      if: "following-sibling::*"
      then: [t: ":"]

-
  name: no-content
  tag: math
  match: "not(*)"
  replace: [t: "𝐖"]

-
  name: default
  tag: math
  match: "."
  variables:
  - MatchingWhitespace: "false()"    # used by the whitespace rule
  replace: [x: "*"]

-
  name: empty-mrow
  tag: mrow
  match: "not(*)"
  replace: [t: "𝐖"]

-
  name: default
  tag: mrow
  match: "."
  replace: [x: "*"]

# Dedicon rule for mfenced without an mrow around its content, as many authors and converters write it:
#   <mfenced open="(" close=")"><mi>a</mi><mo>-</mo><mn>9</mn></mfenced>
#   Without a separators attribute the default separator is a comma (MathML 3, section 3.3.8.2), so MathCAT
#   correctly inserts a comma between every pair of children: "(a, -, 9)". The author meant "(a - 9)".
#   The inserted commas are marked with data-changed='from_mfenced'. If one of the children is an operator (mo),
#   the content is one expression and not a list, so this rule leaves out all inserted commas: "(2a + 5)", "(3 + 2p)".
#   An author writes a list item with an operator in an mrow of its own ("f(x + 1, y)"), so that is not affected.
#   A comma that the author wrote (<mo>,</mo>) is not an inserted comma and stays.
#   Ellipses do not count as operators, as they are part of lists: "{1, 2, ..., n}".
#   Without an operator the inserted commas are kept, as in "f(x, y, z)" and "{1, 2, 3}".
#   With separators="" MathCAT inserts no separators at all, so this rule is not needed there: "(ab)".
#   (see tests/braille/Dedicon/misc.rs, haakjes_en_leestekens::voorbeeld_07 to voorbeeld_10)
-
  name: mfenced-separator-with-operator
  tag: mo
  match: "@data-changed='from_mfenced' and .=',' and
          ../m:mo[not(@data-changed='from_mfenced') and not(.='\u2026' or .='\u22EF' or .='...')]"
  replace: []

# Dedicon rule for mfenced without an mrow around its content as the base of a power: "(2sqrt(3))^2", "(3x)^2", "(12 1/2)^2"
#   As in the rule above, MathCAT correctly inserts the default comma between the children ("(2, sqrt(3))^2"),
#   but here they are only operands, so the rule above does not apply. A list such as a coordinate is not raised
#   to a power, so in the base of a power (msup, msubsup) every inserted comma is left out.
#   msub does not count: a list can have a subscript, such as a vector "(a, b)_1".
#   The base is the mrow with the brackets of the mfenced (its first child is an inserted bracket).
-
  name: mfenced-separator-in-power-base
  tag: mo
  match: "@data-changed='from_mfenced' and .=',' and
          ancestor::m:mrow[*[1][self::m:mo and @data-changed='from_mfenced']][1]
            [not(preceding-sibling::*) and (parent::m:msup or parent::m:msubsup)]"
  replace: []

# Dedicon rules for operators:
# - AlwaysSpacing operators ("=") always get a space before and after them
# - AddSpacing operators get a space before and after them
#   Only for binary use (something on both sides), so a leading minus as in "-x" stays attached
#   Exception: after a percent sign MathCAT reads "100 % - 7 %" as 100 % (-7) %, so the minus is the first child
#   of a row after the "%"; it is binary all the same: "100% - 7%"
# - Division signs (DivisionSlash) become "/" without spaces ("54/9"),
#   except when a space is needed to end a sub- or superscript ("u_n / v_n")
# - Invisible operators stay invisible ("3x"); next to a fraction the space comes from the mfrac rule
# - SpaceAfter operators (the comma) get a space after them only: "{1, 2}", "f(x, y, z)"
# - Exception to invisible operators: MathCAT reads the variable after a quantifier and the formula after it
#   as an implied multiplication (x INVISIBLE-TIMES (...)). That invisible times becomes a space, so the variable
#   does not stick to the formula: "er is een x (Ax ...)", "voor alle y Bxy"
#   Recognized as: the first invisible times, directly after a variable, in the row that follows a quantifier
-
  name: default
  tag: mo
  match: "."
  replace:
  - test:
    - if: "IsInDefinition(., 'Braille', 'AlwaysSpacing')"
      then: [t: "𝐰", x: "text()", t: "𝐰"]
    - else_if: "IsInDefinition(., 'Braille', 'AddSpacing') and following-sibling::* and
                (preceding-sibling::* or parent::m:mrow/preceding-sibling::*[1][self::m:mo and (.='%' or .='‰')])"
      then: [t: "𝐰", x: "text()", t: "𝐰"]
    - else_if: "IsInDefinition(., 'Braille', 'SpaceAfter')"
      then: [x: "text()", t: "𝐰"]
    - else_if: ".='\u2062' and preceding-sibling::*[1][self::m:mi] and not(preceding-sibling::*[2]) and
                parent::m:mrow/preceding-sibling::*[1][self::m:mo and IsInDefinition(., 'Braille', 'Quantifiers')]"
      then: [t: "𝐰"]
    - else_if: "IsInDefinition(., 'Braille', 'DivisionSlash') and
                (preceding-sibling::*[1] | following-sibling::*[1])[self::m:msub or self::m:msup or self::m:msubsup]"
      then: [t: "𝐰", x: "text()", t: "𝐰"]
      else: [x: "text()"]

# Dedicon rule for numbers with no-break spaces (U+00A0) between groups of digits, e.g. from a thin mspace
#   (MathCAT merges "<mn>1</mn><mspace width='0.167em'/><mn>000</mn>" into one number with a no-break space):
#   if the part before the decimal comma is a valid grouping (a first group of 1 to 3 digits, then only groups of
#   exactly 3 digits), the spaces become points, the Dutch thousands separator: "1.000", "50.000.000", "1.000,5".
#   Otherwise the spaces stay (via unicode.yaml): "1 00", "50 00 000"; also spaces after the decimal comma stay.
#   The comparison maps every digit to "d" and compares with the pattern for that number of groups (up to 9 groups).
-
  name: block-separators
  tag: mn
  match: "contains(substring-before(concat(., ','), ','), '\u00A0') and
          not(contains(substring-after(., ','), '\u00A0')) and
          string-length(substring-before(., '\u00A0')) >= 1 and string-length(substring-before(., '\u00A0')) <= 3 and
          translate(substring-before(concat(., ','), ','), '0123456789', 'dddddddddd') =
            concat(substring('ddd', 1, string-length(substring-before(., '\u00A0'))),
                   substring('\u00A0ddd\u00A0ddd\u00A0ddd\u00A0ddd\u00A0ddd\u00A0ddd\u00A0ddd\u00A0ddd', 1,
                             4 * (string-length(substring-before(concat(., ','), ',')) -
                                  string-length(translate(substring-before(concat(., ','), ','), '\u00A0', '')))))"
  replace: [x: "translate(., '\u00A0', '.')"]

-
  name: default
  tag: mn
  match: "."
  replace: [x: "text()"]

# Dedicon rule: a function name is separated by a space from its argument: "log x", "^g log a"
# Before brackets cleanup removes the space again: "log(8)", "det(A)"
# After a variable there is also a space before it: "a sin x"; after a number there is none: "2sin x" (as in "2sqrt(25)").
#   MathCAT puts an invisible times between them
#   and the function name with its argument in a row of its own: a INVISIBLE-TIMES (sin x)
# The space after the name stays before a Greek letter or a minus sign: "sin ~a", "sin -x" (see Dedicon_cleanup in src/braille.rs)
# Based on the named-functions rule in ../ASCIIMath/ASCIIMath_Rules.yaml (FunctionNames is in definitions.yaml),
#   which only checks for a variable directly before the name and always writes a removable space after it
# DISCUSSION: the Dedicon integral example writes "Intg{1/2 ~p..~p}sinxdx", i.e. "sinx" WITHOUT a space,
#   while the logarithm examples write "log x" WITH a space. For now we chose a space after every function
#   name ("sin x"); the expected output of that test was changed accordingly.
#   To be confirmed with Dedicon (see tests/braille/Dedicon/website.rs, differentieren_en_integreren::integreren_voorbeeld_02).
# DISCUSSION: a fraction as argument is written without brackets: "^g log a/b", following the formula on the
#   Dedicon page. That is ambiguous (it can also be read as (^g log a)/b); the linear notation on that page
#   writes "^g log(a/b)". Should such an argument always get brackets?
#   (see tests/braille/Dedicon/website.rs, logaritmen::voorbeeld_06)
-
  name: named-functions
  tag: [mi, mtext]
  match: "IsInDefinition(., 'Braille', 'FunctionNames')"
  replace:
  - test:
      if: "preceding-sibling::*[1][self::m:mi] or
           (preceding-sibling::*[1][self::m:mo and .='\u2062'] and preceding-sibling::*[2][self::m:mi]) or
           (not(preceding-sibling::*) and parent::m:mrow/preceding-sibling::*[1][self::m:mo and .='\u2062'] and
            parent::m:mrow/preceding-sibling::*[2][self::m:mi])"
      then: [t: "𝐖"]
  - x: "text()"
  - t: "𝐖"

# Dedicon rule: variables are passed through literally
-
  name: default
  tag: mi
  match: "."
  replace: [x: "text()"]

# Dedicon rule for an mspace that MathCAT had to keep (e.g. as the only child of mfrac or msqrt): it becomes an mtext
#   with a no-break space, marked data-changed='was-mspace'. Nothing is written: "sqrt()", "()/2".
#   An empty table cell is handled by the empty-cell rule ("gg").
-
  name: empty-mspace
  tag: mtext
  match: "@data-changed='was-mspace'"
  replace: []

# Dedicon rule: text (mtext) is passed through literally and is separated by a space from other content:
#   "De verhouding van drie getallen is 7 : 5 : 3", "1/2 en 1/2"
# A string literal (ms) is written in the same way, between its quotes (lquote/rquote, by default "): "\"abc\""
#   (as the ms rule in ../ASCIIMath/ASCIIMath_Rules.yaml)
# MathCAT strips leading and trailing whitespace from mtext during canonicalization, so the space
# that the author put inside the mtext is lost; this rule adds it back.
# Spaces inside the text are kept, also after a point: "opp. vloer" (see Dedicon_cleanup in src/braille.rs)
# A side gets a space if the neighbour there is not another mtext (and not a bracket, as for fractions).
# As in the mfrac rule, the neighbour may also be found in a row around it (when the mtext is first or last in its row,
#   also more than one row up): "x = 1 en y = 2" with "en y = 2" in a nested row.
-
  name: default
  tag: [mtext, ms]
  match: "."
  variables:
  - Before: "ancestor-or-self::*[preceding-sibling::*][1]"   # nearest element (this one or a row around it) with something before it
  - After: "ancestor-or-self::*[following-sibling::*][1]"    # nearest element (this one or a row around it) with something after it
  replace:
  - test:
      if: "(count($Before | .) = 1 or $Before[self::m:mrow]) and $Before[parent::m:mrow or parent::m:math] and
           not(ancestor::*[not(self::m:mrow)][count(. | $Before/descendant::*) = count($Before/descendant::*)]) and
           $Before/preceding-sibling::*[1][not(self::m:mtext or (self::m:mo and IsInDefinition(., 'Braille', 'OpeningBrackets')))]"
      then: [t: "𝐰"]
  - test:
      if: "self::m:ms"
      then:
      - test:
          if: "string(@lquote)!=''"
          then: [x: "@lquote"]
          else: [t: "\""]
      - x: "text()"
      - test:
          if: "string(@rquote)!=''"
          then: [x: "@rquote"]
          else: [t: "\""]
      else: [x: "text()"]
  - test:
      if: "(count($After | .) = 1 or $After[self::m:mrow]) and $After[parent::m:mrow or parent::m:math] and
           not(ancestor::*[not(self::m:mrow)][count(. | $After/descendant::*) = count($After/descendant::*)]) and
           $After/following-sibling::*[1][not(self::m:mtext or (self::m:mo and IsInDefinition(., 'Braille', 'ClosingBrackets')))]"
      then: [t: "𝐰"]

# Dedicon rule for marks over an expression: "{" mark expression, without a closing brace:
#   overbar (complex conjugate) "{-z", "{-2i"; vector arrow "{-->a", "{-->OA"; hat "{^x"
# If the expression would contain spaces, it gets parentheses to show what is under the mark:
#   "{-(a + bi)", "{-->(F_1 + F_2)", "{^(a + b)"
# Based on the accents rule in ../ASCIIMath/ASCIIMath_Rules.yaml (Accents is in definitions.yaml)
-
  name: accents
  tag: mover
  match: "*[2][IsInDefinition(., 'Braille', 'Accents')]"
  replace:
  - t: "{"
  - x: "DefinitionValue(*[2], 'Braille', 'Accents')"
  - test:
      if: "*[1][IsBracketed(., '', '') or not(descendant-or-self::m:mo[IsInDefinition(., 'Braille', 'AlwaysSpacing') or IsInDefinition(., 'Braille', 'SpaceAfter') or (IsInDefinition(., 'Braille', 'AddSpacing') and preceding-sibling::* and following-sibling::*)] or descendant-or-self::m:mtext)]"
      then: [x: "*[1]"]
      else: [t: "(", x: "*[1]", t: ")"]

# Dedicon rule for primes and degrees: written directly after the base, not as a superscript ("f'(x)")
# Based on the pseudo-scripts rule in ../ASCIIMath/ASCIIMath_Rules.yaml
-
  name: pseudo-scripts
  tag: msup
  match: "*[2][translate(., \"'′″‴⁗°\", '')='']"
  replace:
  - x: "*[1]"
  - test:
      if: "*[1][self::m:mn] and starts-with(*[2], '°')"
      then: [t: "𝐰"]
  - x: "*[2]"

# Dedicon rule for a range on an expression in square brackets ("from ... to ..."): braces with ".." between the limits
#   "[F(x)]{a..b}", "[1/3 x^3]{1..4}"
# Dedicon writes such a sub- and superscript pair as a range instead of "_a ^b" (rules page "onderindex en bovenindex")
# Only for a base in square brackets: for other bases "A_1 ^2" cannot be told apart from a range
-
  name: range-scripts
  tag: msubsup
  match: "*[1][IsBracketed(., '[', ']')]"
  replace:
  - x: "*[1]"
  - t: "{"
  - x: "*[2]"
  - t: ".."
  - x: "*[3]"
  - t: "}"

# Dedicon rule for sub- and superscripts: base "_" subscript, base "^" superscript, without spaces ("x_1", "5^2")
# Structure follows the default script rule in ../ASCIIMath/ASCIIMath_Rules.yaml, with these Dedicon differences:
# - A compound script that is already bracketed (by any pair of fences) gets no extra parentheses: "[dy/dx]_(x = x_A)"
# - A simple script is written as is and ended with a (removable) space: "5^2 + 2", "a_mn * b_mn"
#   Simple means: a single token, a negative token ("x^-1"),
#   or tokens joined only by invisible times/separator ("a_mn", "a_11");
#   anything else is compound and gets parentheses: "5^(2 + 2)", "x_(n + 1)", "e^(x_1)", "9^(1/2)"
# - With both a sub- and a superscript, a space ends the subscript before the "^": "A_1 ^2"
#   (also when the base of a superscript is itself a subscript, as some authors write x_n ^2)
# - A base that is itself a superscript (msup/msubsup), a fraction or an unbracketed group gets parentheses:
#   "(5^2)^x"; a subscript as base gets no parentheses but a space before the "^" (see above)
-
  name: default
  tag: [msub, msup, msubsup]
  match: "."
  replace:
  - test:
      if: "*[1][self::m:msup or self::m:msubsup or self::m:mfrac or (self::m:mrow and not(IsBracketed(., '', '')))]"
      then: [t: "(", x: "*[1]", t: ")"]
      else: [x: "*[1]"]
  - test:
    - if: "self::m:msup and *[1][self::m:msub]"
      then: [t: "𝐰^"]
    - else_if: "self::m:msup"
      then: [t: "^"]
      else: [t: "_"]
  - test:
      if: "*[2][IsNode(., 'leaf') or (self::m:mrow and count(*)=2 and *[1][self::m:mo and (.='-' or .='\u2212' or .='\u2013')] and *[2][IsNode(., 'leaf')]) or (self::m:mrow and not(*[not(IsNode(., 'leaf'))]) and not(m:mo[not(.='\u2062' or .='\u2063')]))]"
      then:
      - x: "*[2]"
      - test:
          if: "not(self::m:msubsup)"
          then: [t: "𝐖"]    # end the script; cleanup removes it where not needed
      else:
      - test:
          if: "*[2][IsBracketed(., '', '')]"
          then: [x: "*[2]"]    # already bracketed
          else: [t: "(", x: "*[2]", t: ")"]
  - test:
      if: "self::m:msubsup"
      then:
      - t: "𝐰^"
      - test:
          if: "*[3][IsNode(., 'leaf') or (self::m:mrow and count(*)=2 and *[1][self::m:mo and (.='-' or .='\u2212' or .='\u2013')] and *[2][IsNode(., 'leaf')]) or (self::m:mrow and not(*[not(IsNode(., 'leaf'))]) and not(m:mo[not(.='\u2062' or .='\u2063')]))]"
          then: [x: "*[3]", t: "𝐖"]
          else:
          - test:
              if: "*[3][IsBracketed(., '', '')]"
              then: [x: "*[3]"]    # already bracketed
              else: [t: "(", x: "*[3]", t: ")"]

# Dedicon rule for large operators with limits: operator "{" lower ".." upper "}" and the expression directly after it
#   "~S{k = 0..n}u_k", "~S{k}u_k", "Intg{a..b}f(x)dx", "Intg{V}f(x, y, z)dV", "lim{n --> inf}u_n"
# Based on the use-sub-superscripts rule in ../ASCIIMath/ASCIIMath_Rules.yaml (MovableLimitsLargeOps is in definitions.yaml),
#   which writes "_" and "^" instead of the Dedicon braces
-
  name: large-op-limits
  tag: [munder, munderover]
  match: "*[1][IsInDefinition(., 'Braille', 'MovableLimitsLargeOps') or @movablelimits='true']"
  replace:
  - x: "*[1]"
  - t: "{"
  - x: "*[2]"
  - test:
      if: "self::m:munderover"
      then: [t: "..", x: "*[3]"]
  - t: "}"

# Fallback for other under/over constructs, for which Dedicon has no notation: written like sub- and superscripts
#   (under "_", over "^"), with parentheses around compound parts, also around a compound base (as for msub/msup):
#   "(a + b)_accoladeOnder", "x_-" (line under x), "x^~"
# NOTE: Dedicon still has to decide on a notation for these constructs (under- and overbraces, a line under an
#   expression, text over an operator as in "= ^def", a label over an arrow as in "A-->^f B"); this output is provisional.
-
  name: default
  tag: [munder, mover, munderover]
  match: "."
  replace:
  - test:
      if: "*[1][self::m:msup or self::m:msubsup or self::m:mfrac or (self::m:mrow and not(IsBracketed(., '', '')))]"
      then: [t: "(", x: "*[1]", t: ")"]
      else: [x: "*[1]"]
  - test:
      if: "self::m:mover"
      then: [t: "^"]
      else: [t: "_"]
  - test:
      if: "*[2][IsNode(., 'leaf')]"
      then: [x: "*[2]"]
      else: [t: "(", x: "*[2]", t: ")"]
  - test:
      if: "self::m:munderover"
      then:
      - t: "𝐰^"
      - test:
          if: "*[3][IsNode(., 'leaf')]"
          then: [x: "*[3]"]
          else: [t: "(", x: "*[3]", t: ")"]
  - t: "𝐖"

# Dedicon rule for scripts before (and after) a base, used for the European logarithm notation:
#   superscript before the base, then a space that ends it: "^10 log 100", "^g log(a)"
# Scripts after the base are written as for msub/msup/msubsup: "_" sub, then (after a space) "^" sup
# Simple scripts are written as is, compound scripts get parentheses (same tests as the script rule above)
# Structure follows the mmultiscripts rule in ../ASCIIMath/ASCIIMath_Rules.yaml, including the variables;
#   only the first pair of pre- and postscripts is formatted, further pairs are written out as is (as in ASCIIMath)
-
  name: default
  tag: mmultiscripts
  match: "."
  variables:
  # computing the number of postscripts is messy because of <mprescripts> being optionally present -- we use "mod" to get the count right
  - Prescripts: "m:mprescripts/following-sibling::*"
  - NumChildren: "count(*)"       # need to stash this since the count is wrong inside '*[...]' below
  - Postscripts: "*[position()>1 and position() < (last() + ($NumChildren mod 2) -count($Prescripts))]"
  replace:
  - test:
      if: "$Prescripts"
      then:
      - test:
          if: "not($Prescripts[1][self::m:none])"
          then:
          - t: "_"
          - test:
            - if: "$Prescripts[1][IsNode(., 'leaf') or (self::m:mrow and count(*)=2 and *[1][self::m:mo and (.='-' or .='\u2212' or .='\u2013')] and *[2][IsNode(., 'leaf')]) or (self::m:mrow and not(*[not(IsNode(., 'leaf'))]) and not(m:mo[not(.='\u2062' or .='\u2063')]))]"
              then: [x: "$Prescripts[1]"]
            - else_if: "$Prescripts[1][IsBracketed(., '', '')]"
              then: [x: "$Prescripts[1]"]    # already bracketed
              else: [t: "(", x: "$Prescripts[1]", t: ")"]
      - test:
          if: "not($Prescripts[2][self::m:none])"
          then:
          - t: "^"
          - test:
            - if: "$Prescripts[2][IsNode(., 'leaf') or (self::m:mrow and count(*)=2 and *[1][self::m:mo and (.='-' or .='\u2212' or .='\u2013')] and *[2][IsNode(., 'leaf')]) or (self::m:mrow and not(*[not(IsNode(., 'leaf'))]) and not(m:mo[not(.='\u2062' or .='\u2063')]))]"
              then: [x: "$Prescripts[2]"]
            - else_if: "$Prescripts[2][IsBracketed(., '', '')]"
              then: [x: "$Prescripts[2]"]    # already bracketed
              else: [t: "(", x: "$Prescripts[2]", t: ")"]
      - test:
          if: "count($Prescripts) > 2"   # give up and just write them out so at least the content is there
          then: [x: "$Prescripts[position() > 2]"]
      - t: "𝐰"    # a space ends the prescript: "^10 log"
  - x: "*[1]"
  - test:
      if: "$Postscripts"
      then:
      - test:
          if: "not($Postscripts[1][self::m:none])"
          then:
          - t: "_"
          - test:
            - if: "$Postscripts[1][IsNode(., 'leaf') or (self::m:mrow and count(*)=2 and *[1][self::m:mo and (.='-' or .='\u2212' or .='\u2013')] and *[2][IsNode(., 'leaf')]) or (self::m:mrow and not(*[not(IsNode(., 'leaf'))]) and not(m:mo[not(.='\u2062' or .='\u2063')]))]"
              then: [x: "$Postscripts[1]"]
            - else_if: "$Postscripts[1][IsBracketed(., '', '')]"
              then: [x: "$Postscripts[1]"]    # already bracketed
              else: [t: "(", x: "$Postscripts[1]", t: ")"]
      - test:
          if: "not($Postscripts[1][self::m:none]) and not($Postscripts[2][self::m:none])"
          then: [t: "𝐰"]    # a space ends the subscript before the superscript, as in "A_1 ^2"
      - test:
          if: "not($Postscripts[2][self::m:none])"
          then:
          - t: "^"
          - test:
            - if: "$Postscripts[2][IsNode(., 'leaf') or (self::m:mrow and count(*)=2 and *[1][self::m:mo and (.='-' or .='\u2212' or .='\u2013')] and *[2][IsNode(., 'leaf')]) or (self::m:mrow and not(*[not(IsNode(., 'leaf'))]) and not(m:mo[not(.='\u2062' or .='\u2063')]))]"
              then: [x: "$Postscripts[2]"]
            - else_if: "$Postscripts[2][IsBracketed(., '', '')]"
              then: [x: "$Postscripts[2]"]    # already bracketed
              else: [t: "(", x: "$Postscripts[2]", t: ")"]
      - test:
          if: "count($Postscripts) > 2"   # give up and just write them out so at least the content is there
          then: [x: "$Postscripts[position() > 2]"]
      - t: "𝐖"    # end the script; cleanup removes it where not needed

# Dedicon rule for enclosures (menclose: box, circle, strike-outs, radical, top, ...): only the content is written
# NOTE: it is not known whether Dedicon uses or writes enclosures; the Dedicon website has no rules for them.
#   This still needs to be investigated (for instance radical as "sqrt(...)" and top as an overbar "{-").
-
  name: default
  tag: menclose
  match: "."
  replace: [x: "*"]

# Fallback rules for elements without a Dedicon rule: the content is written as it is, without any text of its own
#   (ASCIIMath writes "unknown math m l element" and the element name). Without these rules such an element
#   gives an error. They must stay at the end, so that they are only used when no other rule matches.
# Based on default-children, default-no-children and default-no-text in ../ASCIIMath/ASCIIMath_Rules.yaml
-
  name: default-children
  tag: "*"
  match: "*"    # make sure there are children
  replace: [x: "*"]

-
  # at this point, we know there are no children -- might be no text
  name: default-no-children
  tag: "*"
  match: "text()"
  replace: [x: "text()"]

-
  name: default-no-text
  tag: "*"
  match: "."
  replace: []
